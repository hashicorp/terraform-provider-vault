name: Lint GitHub Actions Workflows
on:
  push:
    paths:
    - '.github/**'
  pull_request_target:
    # opened: initial PR creation
    # synchronize: new commits pushed to PR (covers multi-push scenarios)
    # reopened: closed PR is reopened
    types: [opened, synchronize, reopened]
    paths:
    - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actionlint:
    # using `main` as the ref will keep your workflow up-to-date
    uses: hashicorp/vault-workflows-common/.github/workflows/actionlint.yaml@main
